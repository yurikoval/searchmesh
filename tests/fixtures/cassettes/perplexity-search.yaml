            "date": "2025-09-25",
            "last_updated": "2026-10-02",
            "snippet": "# Introducing the Perplexity Search API\nProviding access to the same global-scale infrastructure that powers Perplexity’s public answer engine\n...\n## Providing access to the same global-scale infrastructure that powers Perplexity’s public answer engine\nToday, we’re answering that call by launching the Perplexity Search API.\nOur API provides access to the same global-scale infrastructure that powers Perplexity’s public answer engine.\nWith an index covering hundreds of billions of webpages, developers can now tap information from across the internet with one simple yet powerful interface.\nWe’re also releasing an SDK, open-source evaluation framework, and deep dive by Perplexity Research into how we designed, optimized, and evaluated our Search API.\n...\n## Built for modern AI workloads\nPerplexity Search API is designed for the unique demands of AI applications.\nUnlike other API offerings that expose a restricted universe of information, our API provides rich structured responses that are ready for use in AI and traditional applications alike.\n...\nOur indexing and retrieval infrastructure divides documents up into fine-grained units.\nThese sub-document units are individually surfaced and scored against the original query parameters, allowing our API to return documents with the most relevant snippets already ranked.\nThis means less preprocessing, faster integration, and more valuable downstream results.\n...\n## Market-leading performance, pricing, and ergonomics\nWe’re releasing an open-source evaluation framework, `search_evals`, to enable researchers and developers to rigorously test any publicly available search API.\n...\nWe’ve also carefully designed our API to prioritize ease of use for both human developers and AI agents.\nThis includes our newly-launched API Platform (which now houses the developer console and documentation for both our Search and Sonar APIs) and our Search SDK.\n...\n## Democratizing access to knowledge across humans and code\n[Get started on API Platform]\n[Install our SDK]",
            "title": "Introducing the Perplexity Search API",
            "url": "https://www.perplexity.ai/hub/blog/introducing-the-perplexity-search-api"
          }
        ]
