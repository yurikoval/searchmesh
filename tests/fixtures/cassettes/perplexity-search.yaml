            "snippet": "# Perplexity Search API\n> Access real-time web search results with Perplexity's Search API.\nGet ranked results, domain filtering, multi-query search, and content extraction for developers.\n...\nPerplexity's Search API returns real-time, ranked web results as structured data, with controls for domains, languages, regions\n, and extracted content.\nUse the Search API when you need raw results for your own processing.\nFor an LLM-generated answer with citations, use the [Agent API](/docs/agent-api/quickstart).\n...\nAsk your agent to install the Perplexity Search skill:\n...\nRead https://github.com/perplexityai/api-platform-developers/blob/main/skills/pplx-cli/SKILL.md and install this skill.\n...\nYou can also [try Perplexity Search in the interactive Playground](https://\nconsole.perplexity.ai/project/playground/search) with no API key required.\n...\nYou can now run Perplexity Search straight from your terminal.\nThe [Perplexity CLI](/docs/cli/overview) returns the same ranked results as JSON, ready for shell pipelines and agent tool calls, with no code to write.\n...\nInstall one of our [official SDKs](/docs/sdk/overview) for a convenient, type-safe integration:\n<CodeGroup>\n```bash Python theme={null}\npip install perplexityai\n```\n```bash Ty\npescript theme={null}\nnpm install @perplexity-ai/perplexity_ai\n```\n...\n## Authentication\nSet your API key as an environment variable.\nThe official SDKs read it automatically, but you can also pass it explicitly:\n<Tabs>\n<Tab title=\"macOS/Linux\">\n```bash theme={null}\nexport PERPLEXITY_API_KEY=\"your_api_key_here\"\n```\n</Tab>\n<Tab title=\"Windows\">\n```powershell theme={null}\nsetx PERPLEXITY_API_KEY \"your_api_key_here\"\n```\n...\nStart with \na basic search query to get relevant web results.\n`max_results` accepts values from 1 to 20 and defaults to 10.\nSee the [API Reference](/api-reference/search-post) for all parameters and [pricing](/docs/getting-started/pricing) for search costs.\n...\n```bash cURL theme={null}\ncurl -X POST 'https://api.perplexity.ai/search' \\\n-H \"Authorization: Bearer $PERPLEXITY_API_KEY\" \\\n-H 'Content-Type: application/json' \\\n-d '\n...\nNeed lower latency or lower cost?\nSet `search_type: \"fast\"` in the Search API request body.\nFast Search costs \\$1.00 per 1,000 requests.\n...\nSet `country` to an ISO 3166-1 alpha-2 code such as `US`, `GB`, `DE`, or `JP` to get more geographically relevant results.\nThis is useful for local news, regulations, and other region-specific queries:\n...\nPass up to five related queries in one request to explore different angles of a topic.\nEach query is processed independently:\n...\nThe `search_domain_filter` parameter allows you to limit search results to specific domains (allowlist) or exclude certain domains (denylist) for focused research.\nThe filter works in two modes:\n* **Allowlist mode**: Include only specified domains (no `-` prefix)\n* **Denylist mode**: Exclude specified domains (use `-` prefix)\n...\nYou can add a maximum of 20 domains to the `search_domain_filter` list.\nThe filter works in eit\n...\nThe `search_language_filter` parameter allows you to filter search results by language using ISO 639-1 language codes\n:\n...\nLanguage codes must be valid 2-letter ISO 639-1 codes (e.g., \"en\", \"ru\", \"fr\").\nYou can add a maximum of 10 language codes per request.\n...\nUse `max_tokens` and `max_tokens_per_page` to control how much content is extracted from result pages, whether for response size, total tokens returned, evaluations, or downstream context-window and cost management.\n...\n* `max_tokens_per_page` caps content extracted from each result page.",
            "title": "Perplexity Search API",
