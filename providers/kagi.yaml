schema_version: '1'
id: kagi
name: Kagi Search
description: Web search results from the Kagi Search API.
website_url: https://kagi.com/
documentation_url: https://help.kagi.com/kagi/api/search.html
adapter: kagi
endpoint:
  api_base_url: https://kagi.com/api/v1/
  method: POST
  path: /api/v1/search
capabilities:
  operations: [search]
  optional_inputs: []
authentication:
  fields:
    - name: api_key
      label: API key
request_mapping:
  query: {}
  body:
    query: query
response_mapping:
  results: [data, search]
  title: [title]
  url: [url]
  snippet: [snippet]
