schema_version: '1'
id: kagi
name: Kagi Search
description: General web results from the Kagi Search API.
categories: [general-web]
website_url: https://kagi.com/
documentation_url: https://help.kagi.com/kagi/api/search.html
adapter: kagi
endpoint:
  api_base_url: https://kagi.com/api/v1/
  method: POST
  path: /api/v1/search
capabilities:
  operations: [search]
  optional_inputs: [region, safe_search, time_range]
authentication:
  fields:
    - name: api_key
      label: API key
request_mapping:
  query: {}
  body:
    query: query
    region: filters.region
    safe_search: safe_search
    time_range: filters.after
response_mapping:
  results: [data, search]
  title: [title]
  url: [url]
  snippet: [snippet]
