schema_version: '1'
id: yep
name: Yep Search
description: Web search results from the Yep Search API.
website_url: https://yep.com/
documentation_url: https://platform.yep.com/api-documentation
adapter: yep
endpoint:
  api_base_url: https://platform.yep.com/api/
  method: POST
  path: /api/search
capabilities:
  operations: [search]
  optional_inputs: [language, region, safe_search, time_range]
authentication:
  fields:
    - name: api_key
      label: API key
request_mapping:
  query: {}
  body:
    query: query
    language: language
    region: location
    safe_search: safe_search
    time_range: start_published_date
response_mapping:
  results: [results]
  title: [title]
  url: [url]
  snippet: [description]
