schema_version: '1'
id: yep
name: Yep Search
description: Web search results from the Yep Search API.
website_url: https://yep.com/
documentation_url: https://platform.yep.com/api-documentation
adapter: yep
status: active
available: true
enabled_by_default: false
endpoint:
  api_base_url: https://platform.yep.com/api/
  method: POST
  path: /api/search
capabilities:
  operations: [search]
  optional_inputs: []
authentication:
  credential_mode: user
  fields:
    - name: api_key
      label: API key
request_mapping:
  query: {}
  body:
    query: query
response_mapping:
  results: [results]
  title: [title]
  url: [url]
  snippet: [description]
