schema_version: "1"
id: tavily
name: Tavily Search
description: Web search results from the Tavily Search API.
website_url: https://www.tavily.com/
documentation_url: https://docs.tavily.com/welcome
adapter: tavily
status: active
available: true
enabled_by_default: false
endpoint:
  api_base_url: https://api.tavily.com/
  method: POST
  path: /search
capabilities:
  operations: [search]
  optional_inputs: []
authentication:
  credential_mode: user
  fields:
    - name: api_key
      label: API key
request_mapping:
  query: {}
  body:
    query: query
response_mapping:
  results: [results]
  title: [title]
  url: [url]
  snippet: [content]
